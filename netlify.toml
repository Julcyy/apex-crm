[build]
  publish = "."
  command = "echo 'static demo — no build'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# CRM lives at /crm/
[[redirects]]
  from = "/crm"
  to = "/crm/"
  status = 301

# Old CRM path (root index.html used to be the dashboard)
[[redirects]]
  from = "/crm-dashboard"
  to = "/crm/"
  status = 301
