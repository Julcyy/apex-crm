[build]
  publish = "."
  command = "echo 'static demo — no build'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# index.html is the CRM; force root to the marketing homepage
[[redirects]]
  from = "/"
  to = "/homepage-top.html"
  status = 200
  force = true
